services:
  sft_finetune:
    build:
      context: .
      dockerfile: Dockerfile
    image: sft_finetune:latest
    container_name: sft_finetune

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      MODEL_PATH: /mnt/model/Qwen2.5-3B-Instruct
      TRAIN_DATA: /workspace/lab2/output/train.json
      OUTPUT_DIR: /workspace/lab3_finetune/output/sft
      DS_CONFIG:  /workspace/lab3_finetune/ds_zero3_nvme.json
      # Set ENABLE_LORA=0 to do full fine-tune (needs more VRAM / more NVMe offload)
      ENABLE_LORA: "1"

    volumes:
      - ../:/workspace              # entire project root → /workspace
      - ~/models:/mnt/model         # local model directory
      - /tmp/ds_offload:/ds_offload # NVMe offload staging (root FS is NVMe)

    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    ipc: host
    pid: "host"

    # Build first: docker compose -f docker-compose-sft.yaml build
    # Then train:  docker compose -f docker-compose-sft.yaml run --rm sft_finetune \
    #              deepspeed --num_gpus=1 /workspace/lab3_finetune/train_sft.py
    command: tail -f /dev/null
