services:
  vllm:
    image: vllm/vllm-openai:v0.6.3.post1
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids: ['0']
            capabilities: [gpu]

    environment:
      NVIDIA_VISIBLE_DEVICES: "0"

    volumes:
      - ./:/workspace
      - ~/models:/mnt/model

    ports:
      - "8299:8000"
    ipc: host

    command: >
      --model /mnt/model/Qwen2.5-3B-Instruct-finetuned
      --host 0.0.0.0
      --port 8000
      --served-model-name Qwen2.5-3B-Instruct
      --max-model-len 8192
      --kv-cache-dtype auto
      -tp 1
      --gpu-memory-utilization 0.9
